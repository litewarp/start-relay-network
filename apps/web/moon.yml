language: typescript
layer: application
stack: frontend
tags:
  - tanstack
  - react

tasks:
  dev:
    command: bun run vite dev
    options:
      persistent: true
      cache: false
    deps:
      - start-relay-adapter:build

  build:
    command: bun run vite build
    inputs:
      - src/**/*
      - vite.config.ts
      - tsconfig.json
    outputs:
      - dist/**/*
    deps:
      - start-relay-adapter:build

  preview:
    command: bun vite preview
    options:
      persistent: true
      cache: false

  # The adapter's build wipes dist/ before re-emitting types, so typecheck
  # must wait for it rather than race it.
  typecheck:
    deps:
      - start-relay-adapter:build

  relay:
    command: bun run relay-compiler
    inputs:
      - src/**/*.{ts,tsx}
      - src/**/*.graphql
    outputs: ['src/__generated__/**/*']
