name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run oxfmt --check .

      - name: Lint
        run: bun run moon run :lint

      - name: Typecheck
        run: bun run moon run :typecheck

      - name: Test
        run: bun run moon run :test

      - name: Build
        run: bun run moon run start-relay-adapter:build web:build
